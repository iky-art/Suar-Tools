<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lentera — Demo Console Debug</title>
<style>
  :root{
    --wick:#2a1f14;
    --brass:#c98f3c;
    --brass-light:#e8b563;
    --flame:#ffb347;
    --flame-hot:#ff7a3c;
    --glass:#0f1512;
    --glass-2:#161f1a;
    --ink:#eee6d6;
    --ink-dim:#a99f8c;
    --ok:#7fbf8f;
    --warn:#e0a94a;
    --err:#e0603f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  :focus{outline:none;}
  :focus-visible{outline:2px solid var(--brass); outline-offset:2px; border-radius:4px;}
  body{
    margin:0;
    min-height:100vh;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background:
      radial-gradient(ellipse at 20% -10%, #1c2a20 0%, transparent 55%),
      radial-gradient(ellipse at 90% 10%, #241c14 0%, transparent 50%),
      #0b0f0d;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 160px;
  }
  h1{
    font-weight:400;
    letter-spacing:0.02em;
    font-size:2rem;
    margin-bottom:4px;
    color:var(--brass-light);
  }
  p.sub{
    font-family: -apple-system, system-ui, sans-serif;
    color:var(--ink-dim);
    max-width:520px;
    text-align:center;
    line-height:1.6;
    margin-top:0;
  }
  .stage{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
    gap:12px;
    max-width:640px;
    width:100%;
    margin-top:36px;
    font-family:-apple-system, system-ui, sans-serif;
  }
  .stage button{
    background: linear-gradient(180deg, #1a2320, #10160f);
    border:1px solid #2a352d;
    color:var(--ink);
    padding:14px 10px;
    border-radius:10px;
    cursor:pointer;
    font-size:0.85rem;
    transition:transform .15s ease, border-color .15s ease;
  }
  .stage button:hover{
    transform:translateY(-2px);
    border-color:var(--brass);
  }

  /* ---- Lentera trigger ---- */
  #lentera-trigger{
    position:fixed;
    right:18px;
    bottom:14px;
    width:56px;
    height:80px;
    border:none;
    cursor:pointer;
    z-index:99998;
    background:none;
    padding:0;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,0.5)) drop-shadow(0 0 14px rgba(255,150,60,0.4));
    transform-style:preserve-3d;
    perspective:400px;
    animation: lantern-idle 3.4s ease-in-out infinite;
  }
  #lentera-trigger svg{ width:100%; height:100%; display:block; }
  #lentera-trigger .flame-flicker{ animation: flame-flicker 2.2s ease-in-out infinite; transform-origin:32px 46px; }
  @keyframes flame-flicker{
    0%,100%{ opacity:1; transform:scale(1); }
    30%{ opacity:0.85; transform:scale(0.96) translateY(0.5px); }
    55%{ opacity:1; transform:scale(1.04); }
    80%{ opacity:0.9; transform:scale(0.98); }
  }
  @keyframes lantern-idle{
    0%,100%{ transform:rotate(-3deg); }
    50%{ transform:rotate(3deg); }
  }
  #lentera-trigger.alert{
    animation: lantern-alert 0.6s ease-in-out infinite;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,0.6)) drop-shadow(0 0 18px rgba(224,96,63,0.65));
  }
  @keyframes lantern-alert{
    0%,100%{ transform:scale(1) rotate(-2deg); }
    50%{ transform:scale(1.08) rotate(2deg); }
  }
  #lentera-badge{
    position:fixed;
    right:14px;
    bottom:74px;
    background:var(--err);
    color:#fff;
    font-family:-apple-system, system-ui, sans-serif;
    font-size:11px;
    font-weight:700;
    min-width:18px;
    height:18px;
    border-radius:9px;
    display:none;
    align-items:center;
    justify-content:center;
    padding:0 4px;
    border:2px solid #0b0f0d;
    z-index:99999;
  }

  /* ---- Panel ---- */
  #lentera-panel{
    position:fixed;
    right:16px;
    bottom:102px;
    width:min(420px, calc(100vw - 32px));
    height:min(520px, calc(100vh - 140px));
    background: linear-gradient(160deg, var(--glass-2) 0%, var(--glass) 100%);
    border:1px solid #2b332c;
    border-radius:16px;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.04);
    display:none;
    flex-direction:column;
    overflow:hidden;
    z-index:99999;
    transform-origin:bottom right;
    animation: panel-in 0.25s cubic-bezier(.2,.9,.3,1.3);
    font-family:-apple-system, system-ui, sans-serif;
  }
  @keyframes panel-in{
    from{ opacity:0; transform:scale(0.9) translateY(12px); }
    to{ opacity:1; transform:scale(1) translateY(0); }
  }
  #lentera-panel.open{ display:flex; }

  .lentera-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 14px;
    background:linear-gradient(180deg, rgba(201,143,60,0.12), transparent);
    border-bottom:1px solid #232b25;
  }
  .lentera-head .flame-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--flame);
    box-shadow:0 0 8px 2px rgba(255,150,60,0.6);
  }
  .lentera-head b{ font-weight:600; letter-spacing:0.02em; font-size:13px; color:var(--brass-light); }
  .lentera-head .close{
    margin-left:auto;
    background:none;border:none;color:var(--ink-dim);
    font-size:16px;cursor:pointer;padding:2px 6px;border-radius:6px;
  }
  .lentera-head .close:hover{ background:#1e2620; color:var(--ink); }

  .lentera-tabs{
    display:flex;
    gap:2px;
    padding:6px 10px;
    border-bottom:1px solid #1f2621;
  }
  .lentera-tabs button{
    background:none;border:none;color:var(--ink-dim);
    font-size:12px; padding:6px 10px; border-radius:7px; cursor:pointer;
  }
  .lentera-tabs button.active{
    background:#1c2620; color:var(--brass-light);
  }

  .lentera-body{
    flex:1;
    overflow-y:auto;
    padding:8px 10px 14px;
  }
  .lentera-entry{
    background:#12180f;
    border:1px solid #202a1e;
    border-left:3px solid var(--ok);
    border-radius:8px;
    padding:8px 10px;
    margin-bottom:6px;
    font-size:12px;
    line-height:1.5;
  }
  .lentera-entry.err{ border-left-color:var(--err); }
  .lentera-entry.warn{ border-left-color:var(--warn); }
  .lentera-entry .meta{
    color:var(--ink-dim);
    font-size:10px;
    margin-bottom:3px;
    display:flex;
    justify-content:space-between;
  }
  .lentera-entry pre{
    margin:0;
    white-space:pre-wrap;
    word-break:break-word;
    color:var(--ink);
    font-family: 'SF Mono', Menlo, monospace;
    font-size:11.5px;
  }
  .lentera-cause{
    margin-top:8px;
    background:rgba(201,143,60,0.08);
    border:1px dashed rgba(201,143,60,0.4);
    border-radius:6px;
    padding:8px;
  }
  .lentera-cause .label{
    color:var(--brass-light);
    font-size:10px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    margin-bottom:4px;
    display:block;
  }
  .lentera-cause .cause-text{ font-size:12px; color:var(--ink); }
  .lentera-cause .fix-text{ font-size:11.5px; color:var(--ink-dim); margin-top:4px; }

  .lentera-empty{
    color:var(--ink-dim);
    font-size:12px;
    text-align:center;
    padding:40px 20px;
  }
</style>
</head>
<body>

<h1>Lentera</h1>
<p class="sub">Console debug bikinan sendiri. Bukan Eruda. Saat ada error, Lentera nyala merah dan langsung nunjukin kemungkinan penyebabnya — bukan cuma stack trace mentah.</p>

<div class="stage">
  <button onclick="console.log('Data user berhasil dimuat', {id:1,nama:'Iky'})">console.log biasa</button>
  <button onclick="console.warn('Cache hampir penuh')">console.warn</button>
  <button onclick="undefinedFn()">TypeError: not a function</button>
  <button onclick="const a=null; console.log(a.nama)">Cannot read property</button>
  <button onclick="JSON.parse('{bukan json}')">JSON parse error</button>
  <button onclick="fetch('https://api.tidak-ada-domain-ini.test/data')">Fetch gagal (network)</button>
  <button onclick="Promise.reject('gagal async tanpa catch')">Unhandled rejection</button>
</div>

<!-- ===== Lentera Console (embeddable) ===== -->
<button id="lentera-trigger" title="Buka Lentera">
  <svg viewBox="0 0 64 90" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="flameGlowT" cx="0.5" cy="0.42" r="0.62">
        <stop offset="0%" stop-color="#fff3d6"/>
        <stop offset="35%" stop-color="#ffb84d"/>
        <stop offset="70%" stop-color="#ff8a3c"/>
        <stop offset="100%" stop-color="#7a3f14" stop-opacity="0.3"/>
      </radialGradient>
      <linearGradient id="brassBodyT" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3a2f22"/>
        <stop offset="100%" stop-color="#241a12"/>
      </linearGradient>
      <linearGradient id="brassEdgeT" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#c98f3c"/>
        <stop offset="50%" stop-color="#e8b563"/>
        <stop offset="100%" stop-color="#c98f3c"/>
      </linearGradient>
    </defs>
    <path d="M24 6 Q32 -4 40 6" stroke="url(#brassEdgeT)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <rect x="29" y="4" width="6" height="6" rx="1.5" fill="url(#brassEdgeT)"/>
    <path d="M20 12 L44 12 L38 20 L26 20 Z" fill="url(#brassEdgeT)"/>
    <rect x="26" y="20" width="12" height="3" fill="#2a1f14"/>
    <rect x="18" y="23" width="28" height="42" rx="4" fill="url(#brassBodyT)" stroke="url(#brassEdgeT)" stroke-width="2"/>
    <rect x="21" y="26" width="22" height="36" rx="2.5" fill="#0c0f08" opacity="0.55"/>
    <g class="flame-flicker">
      <ellipse cx="32" cy="46" rx="13" ry="17" fill="url(#flameGlowT)"/>
      <path d="M32 34 C36 40 38 45 34 50 C33 47 31 47 30 50 C27 45 28 40 32 34 Z" fill="#fff3d6"/>
    </g>
    <line x1="24" y1="23" x2="24" y2="65" stroke="url(#brassEdgeT)" stroke-width="1.4"/>
    <line x1="32" y1="23" x2="32" y2="65" stroke="url(#brassEdgeT)" stroke-width="1.4" opacity="0.5"/>
    <line x1="40" y1="23" x2="40" y2="65" stroke="url(#brassEdgeT)" stroke-width="1.4"/>
    <path d="M15 65 L49 65 L44 74 L20 74 Z" fill="url(#brassEdgeT)"/>
    <rect x="26" y="74" width="12" height="5" rx="1.5" fill="url(#brassEdgeT)"/>
  </svg>
</button>
<span id="lentera-badge">0</span>

<div id="lentera-panel">
  <div class="lentera-head">
    <span class="flame-dot"></span>
    <b>Lentera</b>
    <button class="close" onclick="Lentera.toggle(false)">✕</button>
  </div>
  <div class="lentera-tabs">
    <button class="active" data-tab="all" onclick="Lentera.switchTab('all')">Semua</button>
    <button data-tab="error" onclick="Lentera.switchTab('error')">Error</button>
    <button data-tab="network" onclick="Lentera.switchTab('network')">Network</button>
  </div>
  <div class="lentera-body" id="lentera-body">
    <div class="lentera-empty">Belum ada aktivitas. Coba tombol di atas ☝️</div>
  </div>
</div>

<script>
(function(){
  // ===== Kamus pola error -> kemungkinan penyebab & saran perbaikan (Bahasa Indonesia) =====
  const CAUSE_PATTERNS = [
    {
      test: /is not a function/i,
      cause: "Kamu memanggil sesuatu yang bukan fungsi — mungkin nama fungsi salah ketik, belum diimport, atau ke-overwrite oleh variabel lain.",
      fix: "Cek: apakah fungsi ini benar-benar ada di scope ini? Coba console.log(typeof namaFungsi) sebelum dipanggil."
    },
    {
      test: /cannot read propert(y|ies) .* of (null|undefined)/i,
      cause: "Kamu mengakses properti dari nilai null/undefined — objeknya belum ada saat kode ini jalan.",
      fix: "Tambahkan pengecekan (optional chaining `?.`) atau pastikan data sudah selesai dimuat sebelum diakses."
    },
    {
      test: /unexpected token/i,
      cause: "Format teks yang di-parse (biasanya JSON) tidak valid — ada karakter yang salah tempat.",
      fix: "Periksa string sebelum di-JSON.parse(), pastikan tanda kutip dan koma benar."
    },
    {
      test: /failed to fetch|networkerror|err_name_not_resolved/i,
      cause: "Permintaan network gagal — domain tidak ditemukan, tidak ada koneksi, atau diblokir CORS.",
      fix: "Cek URL-nya benar, cek koneksi internet, dan cek header CORS di server tujuan."
    },
    {
      test: /unhandled(promise)? rejection/i,
      cause: "Ada Promise yang gagal (reject) tapi tidak ditangani dengan .catch() atau try/catch.",
      fix: "Bungkus pemanggilan async ini dengan try/catch, atau tambahkan .catch(err => ...)."
    },
    {
      test: /maximum call stack/i,
      cause: "Kemungkinan ada fungsi yang memanggil dirinya sendiri tanpa kondisi berhenti (infinite recursion).",
      fix: "Cek kondisi berhenti (base case) pada fungsi rekursif kamu."
    }
  ];

  function guessCause(message){
    for(const p of CAUSE_PATTERNS){
      if(p.test.test(message)) return p;
    }
    return null;
  }

  // ===== State =====
  const state = { entries: [], tab: 'all', errorCount: 0 };
  const bodyEl = document.getElementById('lentera-body');
  const panelEl = document.getElementById('lentera-panel');
  const triggerEl = document.getElementById('lentera-trigger');
  const badgeEl = document.getElementById('lentera-badge');

  function render(){
    const list = state.entries.filter(e=>{
      if(state.tab==='all') return true;
      if(state.tab==='error') return e.type==='err';
      if(state.tab==='network') return e.type==='network';
      return true;
    });
    if(list.length===0){
      bodyEl.innerHTML = '<div class="lentera-empty">Belum ada aktivitas di tab ini.</div>';
      return;
    }
    bodyEl.innerHTML = list.slice().reverse().map(e=>{
      let causeHtml = '';
      if(e.cause){
        causeHtml = `<div class="lentera-cause">
          <span class="label">Kemungkinan penyebab</span>
          <div class="cause-text">${e.cause.cause}</div>
          <div class="fix-text">💡 ${e.cause.fix}</div>
        </div>`;
      }
      return `<div class="lentera-entry ${e.type}">
        <div class="meta"><span>${e.tag}</span><span>${e.time}</span></div>
        <pre>${e.message}</pre>
        ${causeHtml}
      </div>`;
    }).join('');
  }

  function addEntry(type, tag, message){
    const time = new Date().toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const cause = (type==='err') ? guessCause(message) : null;
    state.entries.push({type, tag, message, time, cause});
    if(type==='err'){
      state.errorCount++;
      badgeEl.style.display = 'flex';
      badgeEl.textContent = state.errorCount;
      triggerEl.classList.add('alert');
      if(!panelEl.classList.contains('open')) Lentera_open();
    }
    render();
  }

  function Lentera_open(){
    panelEl.classList.add('open');
  }

  window.Lentera = {
    toggle(force){
      const willOpen = force !== undefined ? force : !panelEl.classList.contains('open');
      panelEl.classList.toggle('open', willOpen);
      if(willOpen){
        triggerEl.classList.remove('alert');
      }
    },
    switchTab(tab){
      state.tab = tab;
      document.querySelectorAll('.lentera-tabs button').forEach(b=>{
        b.classList.toggle('active', b.dataset.tab===tab);
      });
      render();
    }
  };

  triggerEl.addEventListener('click', ()=> Lentera.toggle());

  // ===== Intercept console =====
  const orig = { log: console.log, warn: console.warn, error: console.error };
  function fmt(args){ return args.map(a => typeof a==='object' ? JSON.stringify(a) : String(a)).join(' '); }

  console.log = function(...args){ addEntry('log','LOG', fmt(args)); orig.log.apply(console,args); };
  console.warn = function(...args){ addEntry('warn','WARN', fmt(args)); orig.warn.apply(console,args); };
  console.error = function(...args){ addEntry('err','ERROR', fmt(args)); orig.error.apply(console,args); };

  // ===== Catch runtime errors =====
  window.addEventListener('error', function(e){
    addEntry('err','RUNTIME ERROR', e.message);
  });
  window.addEventListener('unhandledrejection', function(e){
    addEntry('err','UNHANDLED REJECTION', 'Unhandled Promise Rejection: ' + (e.reason?.message || e.reason));
  });

  // ===== Intercept fetch (network tab) =====
  const origFetch = window.fetch;
  window.fetch = function(...args){
    const url = args[0];
    addEntry('network','FETCH →', String(url));
    return origFetch.apply(this,args).then(res=>{
      addEntry(res.ok ? 'network' : 'err', 'FETCH ' + res.status, String(url));
      return res;
    }).catch(err=>{
      addEntry('err','FETCH FAILED', 'Failed to fetch: ' + url);
      throw err;
    });
  };
})();
</script>
</body>
</html>
